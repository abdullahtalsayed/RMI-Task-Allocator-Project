name: Smart Versioning

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from index.html
        id: get_version
        run: |
          version=$(grep -oP 'v\d+\.\d+\.\d+' index.html | head -1)
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "Detected version: $version"

      - name: Create or force-update tag
        run: |
          new_tag=${{ steps.get_version.outputs.version }}
          git fetch --tags
          # Delete remote tag if it already exists (force-sync to current commit)
          git push origin :refs/tags/$new_tag 2>/dev/null || true
          git tag -fa "$new_tag" -m "Release $new_tag"
          git push origin "$new_tag"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: Release ${{ steps.get_version.outputs.version }}
          generate_release_notes: true
